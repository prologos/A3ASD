; A3ASD (H3DB 미들웨어) 설정 / A3ASD (H3DB middleware) settings
; 이 파일은 A3ASD.exe 와 같은 폴더에 둔다. 인코딩 = 시스템 ANSI(CP949), ';' 또는 '#' 로 시작하는 줄은 주석.
; Keep this file next to A3ASD.exe. Encoding = system ANSI (CP949). Lines starting with ';' or '#' are comments.

[main]
title=A3ASD
keepalive=10

[db]
; mode = mssql(실 DB) | memory(DB 없이 자체 테스트 / self-test without a DB)
mode=mssql
server=127.0.0.1
database=A3
; user= 를 비우면 Windows 인증(A3ASD 를 실행한 Windows 계정으로 로그인, password 무시)
; empty user = Windows authentication (runs as the current Windows account; password ignored)
user=sa
; 실제 비밀번호는 서버에서만 입력한다(저장소에 올리지 말 것) / enter the real password on the server only
password=CHANGE_ME
extra=TrustServerCertificate=True;Encrypt=False;

[socket]
; NN=<포트> <테이블> [역할] [클라이언트]   (원본 tdb.ini 의 [dbconnection] NN= 과 비슷)
; NN=<port> <table> [role] [client]
00=7770 account Account LoginServer
01=8880 charac0 CharDB Main
02=9990 ItemStorage0 StorageDB Main

[pay]
; 계정 만료 확인. LoginServer 의 [PAYSERVER] 연결을 받는다 (docs/LoginServer-Pay.md).
; Account expiry check. Accepts the LoginServer [PAYSERVER] link.
; port = LoginServer 가 접속하는 포트. 0 = 끔. LoginServer 기본값은 3000 이다.
;        0 이면 LoginServer 는 만료 확인 없이 로그인시킨다.
; port = port LoginServer connects to. 0 = off. LoginServer defaults to 3000.
port=0
; 만료 시각 컬럼이 있는 테이블 / table holding the expiry column
table=account
; column 값이 NULL 이거나 컬럼이 없으면 만료되지 않은 것으로 응답한다.
; A NULL value or a missing column is answered as not expired.
column=d_edate

[log]
; wire=1 요청/응답 한 줄 요약, payload=1 본문 전체(대용량·민감정보, 디버그용만)
; wire=1 one-line summary per message, payload=1 full payload (large and sensitive, debugging only)
wire=1
payload=0
; exe 폴더 기준 / relative to the exe folder
dir=log
; keepdays = 로그 파일(A3ASD-yyyyMMdd.log) 보관 일수, 지나면 자동 삭제. 0 = 삭제 안 함
; keepdays = days to keep log files (A3ASD-yyyyMMdd.log); older files are deleted automatically. 0 = keep forever
keepdays=30
