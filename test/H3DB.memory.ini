; A3ASD 메모리 모드 자체 테스트용 (DB 불필요) - test/wiretest.js, test/paytest.js 와 함께 사용
; Memory-mode self-test config (no DB) - use with test/wiretest.js and test/paytest.js

[main]
title=A3ASD (memory test)
keepalive=10

[db]
mode=memory

[socket]
00=7770 account Account LoginServer
01=8880 charac0 CharDB Main
02=9990 ItemStorage0 StorageDB Main

[pay]
port=13000
table=account
column=c_sheadera

[log]
wire=1
payload=1
dir=log_memtest
; keepdays = 로그 파일(A3ASD-yyyyMMdd.log) 보관 일수, 지나면 자동 삭제. 0 = 삭제 안 함
; keepdays = days to keep log files (A3ASD-yyyyMMdd.log); older files are deleted automatically. 0 = keep forever
keepdays=30
